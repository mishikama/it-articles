name: Push To Container Registry

on:
  push:
    branches:
      - master
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
    outputs:
      image_tag:
        value: ${{ jobs.build.outputs.image_tag }}
      image_prefix:
        value: ${{ jobs.build.outputs.image_prefix }}

env:
  CR_REGISTRY: cr.example.com/my-project
  CR_REPOSITORY: app
  GHCR_CACHE_REF: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  build:
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_prefix: ${{ steps.branch.outputs.image_prefix }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Set image prefix from branch
        id: branch
        run: |
          IMAGE_PREFIX=$(echo "${{ inputs.branch || github.ref_name }}" | sed 's/[^a-zA-Z0-9._]/_/g')
          echo "image_prefix=${IMAGE_PREFIX}" >> "$GITHUB_OUTPUT"

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CR_REGISTRY }}
          username: ${{ secrets.CR_USERNAME }}
          password: ${{ secrets.CR_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CR_REGISTRY }}/${{ env.CR_REPOSITORY }}
          tags: type=raw,value=-{{sha}}-{{date 'YYYYMMDDHHmmss'}},prefix="${{ steps.branch.outputs.image_prefix }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.GHCR_CACHE_REF }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_CACHE_REF }}:buildcache,mode=max
          platforms: linux/amd64
